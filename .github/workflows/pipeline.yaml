name: CI Secrets and Artifacts Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-tests-and-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Ejecutar pytest
        run: pytest -v

      # Paso nuevo: Ejecutar el script inyectando el secreto guardado en GitHub
      - name: Generar archivo de reporte
        env:
          API_TOKEN: ${{ secrets.MI_API_TOKEN_SECRETO }}
        run: python operaciones.py

      # Paso nuevo: Guardar el archivo generado como un Artefacto descargable
      - name: Guardar reporte como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pipeline-python
          path: reporte_ejecucion.txt