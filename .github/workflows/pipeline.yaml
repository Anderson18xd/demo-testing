# 1. Nombre visible del flujo de trabajo en la interfaz de GitHub
name: CI Python Pipeline

# 2. El Disparador (Trigger): ¿Cuándo se debe ejecutar este robot?
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# 3. Los Trabajos (Jobs): Qué tareas va a realizar el pipeline
jobs:
  run-tests:
    # El Runner: La máquina virtual limpia que alquila GitHub (usaremos Ubuntu)
    runs-on: ubuntu-latest

    steps:
      # Paso A: Descargar tu repositorio en la máquina virtual de GitHub
      - name: Clonar código del repositorio
        uses: actions/checkout@v4

      # Paso B: Configurar la versión de Python en esa máquina virtual
      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Paso C: Instalar las herramientas necesarias (pytest)
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # Paso D: Ejecutar las pruebas unitarias (¡El momento de la verdad!)
      - name: Ejecutar pytest
        run: pytest -v