name: CI Quality Gate and Test Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  code-quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias y herramientas de calidad
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      # NUEVO PASO: El Quality Gate (Validación de Estilo)
      - name: Ejecutar linter (Flake8)
        run: |
          # Evaluamos el código exigiendo un límite de longitud de línea razonable
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Ejecutar pytest
        run: pytest -v

      - name: Generar archivo de reporte
        env:
          API_TOKEN: ${{ secrets.MI_API_TOKEN_SECRETO }}
        run: python operaciones.py

      - name: Guardar reporte como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pipeline-python
          path: reporte_ejecucion.txt